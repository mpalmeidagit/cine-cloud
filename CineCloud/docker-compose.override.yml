services:

  cachedb:
    container_name: cachedb
    restart: always
    ports:
      - "6379:6379"

  querydb:
    container_name: querydb
    restart: always
    ports:
      - "27017:27017"

  writedb:
    container_name: writedb
    restart: always
    environment:
      SA_PASSWORD: "1q2w3e4r@#$"
      ACCEPT_EULA: "Y"
    ports:
      - "1437:1433"

  rabbitmq:
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  cinecloud.webapi:
    container_name: cinecloud.webapi
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8000:8080"
    depends_on:
      - cachedb
      - writedb
      - querydb
      - rabbitmq

  cinecloud.consumer:
    container_name: cinecloud.consumer
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8001:8080"
    depends_on:
      - querydb
      - rabbitmq
